<body class="surprise-page"><main><h1 class="visually-hidden">A little poetry</h1><figure class="poem"><blockquote cite="https://rpo.library.utoronto.ca/content/she-walks-beauty#:~:text=She%20walks%20in%20beauty%2C%20like%20the%20night"><p id="surprise-message">She walks in beauty, like the night
Of cloudless climes and starry skies;
And all that&#x27;s best of dark and bright
Meet in her aspect and her eyes:
Thus mellow&#x27;d to that tender light
Which heaven to gaudy day denies.</p></blockquote><figcaption><p id="poem-author">— Lord Byron</p><a id="poem-work" href="https://rpo.library.utoronto.ca/content/she-walks-beauty#:~:text=She%20walks%20in%20beauty%2C%20like%20the%20night" title="Read the cited edition">She Walks in Beauty (excerpt)</a></figcaption></figure><p class="return-link"><a href="index.html">back to site</a></p></main>
<script id="poetry-data" type="application/json">[{"id":"byron-beauty-1","author":"Lord Byron","title":"She Walks in Beauty","text":"She walks in beauty, like the night\nOf cloudless climes and starry skies;\nAnd all that's best of dark and bright\nMeet in her aspect and her eyes:\nThus mellow'd to that tender light\nWhich heaven to gaudy day denies.","excerpt":true,"sourceUrl":"https://rpo.library.utoronto.ca/content/she-walks-beauty#:~:text=She%20walks%20in%20beauty%2C%20like%20the%20night"},{"id":"treasury-5","author":"Christopher Marlowe","title":"The Passionate Shepherd to His Love","text":"Come live with me and be my Love,\nAnd we will all the pleasures prove\nThat hills and valleys, dale and field,\nAnd all the craggy mountains yield.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Come%20live%20with%20me%20and%20be%20my%20Love%2C"},{"id":"treasury-8","author":"William Shakespeare","title":"It Was a Lover and His Lass","text":"It was a lover and his lass\nWith a hey, and a ho, and a hey-nonino!\nThat o'er the green cornfield did pass,\nIn the spring time, the only pretty ring time,\nWhen birds do sing hey ding a ding:\nSweet lovers love the Spring.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=It%20was%20a%20lover%20and%20his%20lass"},{"id":"treasury-11","author":"William Shakespeare","title":"Sonnet 97","text":"How like a winter hath my absence been\nFrom Thee, the pleasure of the fleeting year!\nWhat freezings have I felt, what dark days seen,\nWhat old December's bareness everywhere!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=How%20like%20a%20winter%20hath%20my%20absence%20been"},{"id":"treasury-12","author":"William Shakespeare","title":"Sonnet 29","text":"Yet in these thoughts my self almost despising,\nHaply I think on Thee—and then my state,\nLike to the lark at break of day arising\nFrom sullen earth, sings hymns at heaven's gate;\nFor thy sweet love remember'd, such wealth brings\nThat then I scorn to change my state with kings.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Yet%20in%20these%20thoughts%20my%20self%20almost%20despising%2C"},{"id":"treasury-13","author":"William Shakespeare","title":"Sonnet 109","text":"For nothing this wide universe I call,\nSave thou, my rose, in it thou art my all.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=For%20nothing%20this%20wide%20universe%20I%20call%2C"},{"id":"treasury-14","author":"William Shakespeare","title":"Sonnet 104","text":"To me, fair Friend, you never can be old,\nFor as you were when first your eye I eyed\nSuch seems your beauty still. Three winters cold\nHave from the forests shook three summers' pride;\nThree beauteous springs to yellow autumn turn'd,\nIn process of the seasons have I seen,\nThree April perfumes in three hot Junes burn'd,\nSince first I saw you fresh which yet are green.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=To%20me%2C%20fair%20Friend%2C%20you%20never%20can%20be%20old%2C"},{"id":"treasury-15","author":"Henry Constable","title":"Diaphenia","text":"Diaphenia like the daffadowndilly,\nWhite as the sun, fair as the lily,\nHeigh ho, how do I love thee!\nI do love thee as my lambs\nAre belovéd of their dams;\nHow blest were I if thou would'st prove me.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Diaphenia%20like%20the%20daffadowndilly%2C"},{"id":"treasury-16","author":"Thomas Lodge","title":"Rosaline","text":"Her eyes are sapphires set in snow,\nResembling heaven by every wink;\nThe Gods do fear whenas they glow,\nAnd I do tremble when I think\nHeigh ho, would she were mine!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Her%20eyes%20are%20sapphires%20set%20in%20snow%2C"},{"id":"treasury-18","author":"William Shakespeare","title":"Sonnet 18","text":"Shall I compare thee to a summer's day?\nThou art more lovely and more temperate:\nRough winds do shake the darling buds of May,\nAnd summer's lease hath all too short a date:","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Shall%20I%20compare%20thee%20to%20a%20summer%27s%20day%3F"},{"id":"treasury-19","author":"William Shakespeare","title":"Sonnet 106","text":"So all their praises are but prophecies\nOf this our time, all, you prefiguring;\nAnd for they look'd but with divining eyes,\nThey had not skill enough your worth to sing:\nFor we, which now behold these present days,\nHave eyes to wonder, but lack tongues to praise.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=So%20all%20their%20praises%20are%20but%20prophecies"},{"id":"treasury-23","author":"William Shakespeare","title":"Sonnet 116","text":"Let me not to the marriage of true minds\nAdmit impediments. Love is not love\nWhich alters when it alteration finds,\nOr bends with the remover to remove:—\nO no! it is an ever-fixéd mark\nThat looks on tempests and is never shaken;\nIt is the star to every wandering bark\nWhose worth's unknown, although his height be taken.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Let%20me%20not%20to%20the%20marriage%20of%20true%20minds"},{"id":"treasury-24","author":"Philip Sidney","title":"My True Love Hath My Heart","text":"My true love hath my heart, and I have his,\nBy just exchange one to the other given:\nI hold his dear, and mine he cannot miss,\nThere never was a better bargain driven:\nMy true love hath my heart, and I have his.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=My%20true%20love%20hath%20my%20heart%2C%20and%20I%20have%20his%2C"},{"id":"treasury-25","author":"Joshua Sylvester","title":"Love’s Omnipresence","text":"Were you the earth, dear Love, and I the skies,\nMy love should shine on you like to the sun,\nAnd look upon you with ten thousand eyes\nTill heaven wax'd blind, and till the world were done.\nWhereso'er I am, below, or else above you,\nWhereso'er you are, my heart shall truly love you.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Were%20you%20the%20earth%2C%20dear%20Love%2C%20and%20I%20the%20skies%2C"},{"id":"treasury-26","author":"William Shakespeare","title":"O Mistress Mine","text":"O Mistress mine, where are you roaming?\nO, stay and hear! your true-love's coming\nThat can sing both high and low;\nTrip no further, pretty sweeting,\nJourneys end in lovers' meeting—\nEvery wise man's son doth know.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=O%20Mistress%20mine%2C%20where%20are%20you%20roaming%3F"},{"id":"treasury-28","author":"William Shakespeare","title":"Sonnet 73","text":"—This thou perceiv'st, which makes thy love more strong,\nTo love that well which thou must leave ere long.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=%E2%80%94This%20thou%20perceiv%27st%2C%20which%20makes%20thy%20love%20more%20strong%2C"},{"id":"treasury-29","author":"William Shakespeare","title":"Sonnet 30","text":"—But if the while I think on thee, dear friend,\nAll losses are restored, and sorrows end.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=%E2%80%94But%20if%20the%20while%20I%20think%20on%20thee%2C%20dear%20friend%2C"},{"id":"treasury-36","author":"William Shakespeare","title":"Take, O Take Those Lips Away","text":"Take O take those lips away\nThat so sweetly were forsworn,\nAnd those eyes, the break of day,\nLights that do mislead the morn:\nBut my kisses bring again,\nBring again—\nSeals of love, but seal'd in vain,\nSeal'd in vain!","excerpt":false,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Take%20O%20take%20those%20lips%20away"},{"id":"treasury-89","author":"Edmund Waller","title":"Go, Lovely Rose!","text":"Go, lovely Rose!\nTell her, that wastes her time and me,\nThat now she knows,\nWhen I resemble her to thee,\nHow sweet and fair she seems to be.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Go%2C%20lovely%20Rose%21"},{"id":"treasury-90","author":"Ben Jonson","title":"To Celia","text":"Drink to me only with thine eyes,\nAnd I will pledge with mine;\nOr leave a kiss but in the cup\nAnd I'll not look for wine.\nThe thirst that from the soul doth rise\nDoth ask a drink divine;\nBut might I of Jove's nectar sup,\nI would not change for thine.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Drink%20to%20me%20only%20with%20thine%20eyes%2C"},{"id":"treasury-93","author":"Robert Herrick","title":"Upon Julia’s Clothes","text":"Whenas in silks my Julia goes\nThen, then (methinks) how sweetly flows\nThat liquefaction of her clothes.\nNext, when I cast mine eyes and see\nThat brave vibration each way free;\nO how that glittering taketh me!","excerpt":false,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Whenas%20in%20silks%20my%20Julia%20goes"},{"id":"treasury-95","author":"Edmund Waller","title":"On a Girdle","text":"A narrow compass! and yet there\nDwelt all that's good, and all that's fair:\nGive me but what this ribband bound,\nTake all the rest the Sun goes round.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=A%20narrow%20compass%21%20and%20yet%20there"},{"id":"treasury-96","author":"Robert Herrick","title":"To Anthea, Who May Command Him Any Thing","text":"Thou art my life, my love, my heart,\nThe very eyes of me,\nAnd hast command of every part,\nTo live and die for thee.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Thou%20art%20my%20life%2C%20my%20love%2C%20my%20heart%2C"},{"id":"treasury-99","author":"Richard Lovelace","title":"To Althea, from Prison","text":"When Love with unconfinéd wings\nHovers within my gates,\nAnd my divine Althea brings\nTo whisper at the grates;\nWhen I lie tangled in her hair\nAnd fetter'd to her eye,\nThe birds that wanton in the air\nKnow no such liberty.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=When%20Love%20with%20unconfin%C3%A9d%20wings"},{"id":"treasury-130","author":"John Gay","title":"Black-Eyed Susan","text":"\"O Susan, Susan, lovely dear,\nMy vows shall ever true remain\nLet me kiss off that falling tear;\nWe only part to meet again.\nChange as ye list, ye winds; my heart shall be\nThe faithful compass that still points to thee.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=%22O%20Susan%2C%20Susan%2C%20lovely%20dear%2C"},{"id":"treasury-131","author":"Henry Carey","title":"Sally in Our Alley","text":"Of all the girls that are so smart\nThere's none like pretty Sally;\nShe is the darling of my heart,\nAnd she lives in our alley.\nThere is no lady in the land\nIs half so sweet as Sally;\nShe is the darling of my heart,\nAnd she lives in our alley.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Of%20all%20the%20girls%20that%20are%20so%20smart"},{"id":"treasury-135","author":"Samuel Rogers","title":"The Sleeping Beauty","text":"Sleep on, and dream of Heaven awhile—\nTho' shut so close thy laughing eyes,\nThy rosy lips still wear a smile\nAnd move, and breathe delicious sighs!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Sleep%20on%2C%20and%20dream%20of%20Heaven%20awhile%E2%80%94"},{"id":"treasury-148","author":"Robert Burns","title":"Mary Morison","text":"O Mary, at thy window be,\nIt is the wish'd, the trysted hour!\nThose smiles and glances let me see\nThat make the miser's treasure poor:\nHow blythely wad I bide the stoure,\nA weary slave frae sun to sun,\nCould I the rich reward secure,\nThe lovely Mary Morison.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=O%20Mary%2C%20at%20thy%20window%20be%2C"},{"id":"treasury-149","author":"Robert Burns","title":"Bonnie Lesley","text":"To see her is to love her,\nAnd love but her for ever;\nFor nature made her what she is,\nAnd ne'er made sic anither!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=To%20see%20her%20is%20to%20love%20her%2C"},{"id":"treasury-150","author":"Robert Burns","title":"A Red, Red Rose","text":"O my Luve's like a red, red rose\nThat's newly sprung in June:\nO my Luve's like the melodie\nThat's sweetly play'd in tune.\nAs fair art thou, my bonnie lass,\nSo deep in luve am I:\nAnd I will luve thee still, my dear,\nTill a' the seas gang dry:","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=O%20my%20Luve%27s%20like%20a%20red%2C%20red%20rose"},{"id":"treasury-155","author":"Robert Burns","title":"Jean","text":"I see her in the dewy flowers,\nI see her sweet and fair:\nI hear her in the tunefu' birds,\nI hear her charm the air:\nThere's not a bonnie flower that springs,\nBy fountain, shaw, or green;\nThere's not a bonnie bird that sings\nBut minds me o' my Jean.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=I%20see%20her%20in%20the%20dewy%20flowers%2C"},{"id":"treasury-156","author":"Robert Burns","title":"John Anderson, My Jo","text":"John Anderson my jo, John,\nWe clamb the hill thegither,\nAnd mony a canty day, John,\nWe've had wi' ane anither:\nNow we maun totter down, John,\nBut hand in hand we'll go,\nAnd sleep thegither at the foot,\nJohn Anderson my jo.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=John%20Anderson%20my%20jo%2C%20John%2C"},{"id":"treasury-161","author":"William Cowper","title":"To Mary Unwin","text":"Mary! I want a lyre with other strings,\nSuch aid from heaven as some have feign'd they drew,\nAn eloquence scarce given to mortals, new\nAnd undebased by praise of meaner things,\nThat ere through age or woe I shed my wings\nI may record thy worth with honour due,\nIn verse as musical as thou art true\nAnd that immortalizes whom it sings:—","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Mary%21%20I%20want%20a%20lyre%20with%20other%20strings%2C"},{"id":"treasury-162","author":"William Cowper","title":"To Mary","text":"Thy silver locks, once auburn bright\nAre still more lovely in my sight\nThan golden beams of orient light,\nMy Mary!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Thy%20silver%20locks%2C%20once%20auburn%20bright"},{"id":"treasury-168","author":"Samuel Taylor Coleridge","title":"Love","text":"All thoughts, all passions, all delights,\nWhatever stirs this mortal frame,\nAll are but ministers of Love,\nAnd feed his sacred flame.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=All%20thoughts%2C%20all%20passions%2C%20all%20delights%2C"},{"id":"treasury-169","author":"Lord Byron","title":"All for Love","text":"O Fame!—if I e'er took delight in thy praises,\n'Twas less for the sake of thy high-sounding phrases,\nThan to see the bright eyes of the dear one discover\nShe thought that I was not unworthy to love her.\nThere chiefly I sought thee, there only I found thee;\nHer glance was the best of the rays that surround thee;\nWhen it sparkled o'er aught that was bright in my story,\nI knew it was love, and I felt it was glory.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=O%20Fame%21%E2%80%94if%20I%20e%27er%20took%20delight%20in%20thy%20praises%2C"},{"id":"treasury-171","author":"Lord Byron","title":"There Be None of Beauty’s Daughters","text":"There be none of Beauty's daughters\nWith a magic like Thee;\nAnd like music on the waters\nIs thy sweet voice to me:\nWhen, as if its sound were causing\nThe charméd ocean's pausing,\nThe waves lie still and gleaming,\nAnd the lull'd winds seem dreaming","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=There%20be%20none%20of%20Beauty%27s%20daughters"},{"id":"treasury-172","author":"Percy Bysshe Shelley","title":"Lines to an Indian Air","text":"I arise from dreams of Thee\nIn the first sweet sleep of night,\nWhen the winds are breathing low\nAnd the stars are shining bright:\nI arise from dreams of thee,\nAnd a spirit in my feet\nHath led me—who knows how?\nTo thy chamber-window, Sweet!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=I%20arise%20from%20dreams%20of%20Thee"},{"id":"treasury-174","author":"William Wordsworth","title":"She Was a Phantom of Delight","text":"She was a phantom of delight\nWhen first she gleam'd upon my sight;\nA lovely apparition, sent\nTo be a moment's ornament;\nHer eyes as stars of twilight fair;\nLike Twilight's, too, her dusky hair;\nBut all things else about her drawn\nFrom May-time and the cheerful dawn;","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=She%20was%20a%20phantom%20of%20delight"},{"id":"treasury-175","author":"Hartley Coleridge","title":"She Is Not Fair to Outward View","text":"She is not fair to outward view\nAs many maidens be;\nHer loveliness I never knew\nUntil she smiled on me.\nO then I saw her eye was bright,\nA well of love, a spring of light.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=She%20is%20not%20fair%20to%20outward%20view"},{"id":"treasury-176","author":"Percy Bysshe Shelley","title":"I Fear Thy Kisses, Gentle Maiden","text":"I fear thy kisses, gentle maiden;\nThou needest not fear mine;\nMy spirit is too deeply laden\nEver to burthen thine.\nI fear thy mien, thy tones, thy motion;\nThou needest not fear mine;\nInnocent is the heart's devotion\nWith which I worship thine.","excerpt":false,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=I%20fear%20thy%20kisses%2C%20gentle%20maiden%3B"},{"id":"treasury-183","author":"Thomas Campbell","title":"Freedom and Love","text":"How delicious is the winning\nOf a kiss at love's beginning,\nWhen two mutual hearts are sighing\nFor the knot there's no untying!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=How%20delicious%20is%20the%20winning"},{"id":"treasury-184","author":"Percy Bysshe Shelley","title":"Love’s Philosophy","text":"The fountains mingle with the river\nAnd the rivers with the ocean,\nThe winds of heaven mix for ever\nWith a sweet emotion;\nNothing in the world is single,\nAll things by a law divine\nIn one another's being mingle—\nWhy not I with thine?","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=The%20fountains%20mingle%20with%20the%20river"},{"id":"treasury-185","author":"Thomas Moore","title":"Echoes","text":"Yet Love hath echoes truer far\nAnd far more sweet\nThan e'er, beneath the moonlight's star,\nOf horn or lute or soft guitar\nThe songs repeat.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Yet%20Love%20hath%20echoes%20truer%20far"},{"id":"treasury-186","author":"Walter Scott","title":"A Serenade","text":"The village maid steals through the shade\nHer shepherd's suit to hear;\nTo Beauty shy, by lattice high,\nSings high-born Cavalier.\nThe star of Love, all stars above,\nNow reigns o'er earth and sky,\nAnd high and low the influence know—\nBut where is County Guy?","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=The%20village%20maid%20steals%20through%20the%20shade"},{"id":"treasury-198","author":"John Keats","title":"Bright Star","text":"No—yet still steadfast, still unchangeable,\nPillow'd upon my fair Love's ripening breast\nTo feel for ever its soft fall and swell,\nAwake for ever in a sweet unrest;\nStill, still to hear her tender-taken breath,\nAnd so live ever,—or else swoon to death.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=No%E2%80%94yet%20still%20steadfast%2C%20still%20unchangeable%2C"},{"id":"treasury-203","author":"Percy Bysshe Shelley","title":"One Word Is Too Often Profaned","text":"I can give not what men call love;\nBut wilt thou accept not\nThe worship the heart lifts above\nAnd the Heavens reject not:\nThe desire of the moth for the star,\nOf the night for the morrow,\nThe devotion to something afar\nFrom the sphere of our sorrow?","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=I%20can%20give%20not%20what%20men%20call%20love%3B"},{"id":"treasury-252","author":"Percy Bysshe Shelley","title":"To a Lady, with a Guitar","text":"Poor Ariel sends this silent token\nOf more than ever can be spoken;\nYour guardian spirit, Ariel, who\nFrom life to life, must still pursue\nYour happiness, for thus alone\nCan Ariel ever find his own;","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Poor%20Ariel%20sends%20this%20silent%20token"},{"id":"treasury-259","author":"Percy Bysshe Shelley","title":"The Invitation","text":"Best and Brightest, come away,\nFairer far than this fair day,\nWhich, like thee, to those in sorrow\nComes to bid a sweet good-morrow\nTo the rough year just awake\nIn its cradle on the brake.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Best%20and%20Brightest%2C%20come%20away%2C"},{"id":"treasury-260","author":"Percy Bysshe Shelley","title":"The Recollection","text":"And still I felt the centre of\nThe magic circle there\nWas one fair Form that fill'd with love\nThe lifeless atmosphere.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=And%20still%20I%20felt%20the%20centre%20of"},{"id":"treasury-271","author":"Percy Bysshe Shelley","title":"Hymn to the Spirit of Nature","text":"Life of Life! Thy lips enkindle\nWith their love the breath between them;\nAnd thy smiles before they dwindle\nMake the cold air fire; then screen them\nIn those locks, where whoso gazes\nFaints, entangled in their mazes.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Life%20of%20Life%21%20Thy%20lips%20enkindle"},{"id":"treasury-288","author":"Percy Bysshe Shelley","title":"Music, When Soft Voices Die","text":"Music, when soft voices die,\nVibrates in the memory—\nOdours, when sweet violets sicken,\nLive within the sense they quicken.\nRose leaves, when the rose is dead,\nAre heap'd for the beloved's bed;\nAnd so thy thoughts, when Thou art gone,\nLove itself shall slumber on.","excerpt":false,"sourceUrl":"https://www.gutenberg.org/cache/epub/19221/pg19221-images.html#:~:text=Music%2C%20when%20soft%20voices%20die%2C"},{"id":"browning-I","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese I","text":"And a voice said in mastery, while I strove,—\n“Guess now who holds thee!”—“Death,” I said, But, there,\nThe silver answer rang, “Not Death, but Love.”","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=And%20a%20voice%20said%20in%20mastery%2C%20while%20I%20strove%2C%E2%80%94"},{"id":"browning-II","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese II","text":"Men could not part us with their worldly jars,\nNor the seas change us, nor the tempests bend;\nOur hands would touch for all the mountain-bars:\nAnd, heaven being rolled between us at the end,\nWe should but vow the faster for the stars.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Men%20could%20not%20part%20us%20with%20their%20worldly%20jars%2C"},{"id":"browning-VI","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese VI","text":"Thy touch upon the palm.  The widest land\nDoom takes to part us, leaves thy heart in mine\nWith pulses that beat double.  What I do\nAnd what I dream include thee, as the wine\nMust taste of its own grapes.  And when I sue\nGod for myself, He hears that name of thine,\nAnd sees within my eyes the tears of two.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Thy%20touch%20upon%20the%20palm.%20%20The%20widest%20land"},{"id":"browning-VII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese VII","text":"The names of country, heaven, are changed away\nFor where thou art or shalt be, there or here;\nAnd this . . . this lute and song . . . loved yesterday,\n(The singing angels know) are only dear\nBecause thy name moves right in what they say.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=The%20names%20of%20country%2C%20heaven%2C%20are%20changed%20away"},{"id":"browning-VIII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese VIII","text":"What can I give thee back, O liberal\nAnd princely giver, who hast brought the gold\nAnd purple of thine heart, unstained, untold,\nAnd laid them on the outside of the wall\nFor such as I to take or leave withal,\nIn unexpected largesse? am I cold,","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=What%20can%20I%20give%20thee%20back%2C%20O%20liberal"},{"id":"browning-X","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese X","text":"Yet, love, mere love, is beautiful indeed\nAnd worthy of acceptation.  Fire is bright,\nLet temple burn, or flax; an equal light\nLeaps in the flame from cedar-plank or weed:","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Yet%2C%20love%2C%20mere%20love%2C%20is%20beautiful%20indeed"},{"id":"browning-XII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XII","text":"And love called love.  And thus, I cannot speak\nOf love even, as a good thing of my own:\nThy soul hath snatched up mine all faint and weak,\nAnd placed it by thee on a golden throne,—\nAnd that I love (O soul, we must be meek!)\nIs by thee only, whom I love alone.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=And%20love%20called%20love.%20%20And%20thus%2C%20I%20cannot%20speak"},{"id":"browning-XIII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XIII","text":"And wilt thou have me fashion into speech\nThe love I bear thee, finding words enough,\nAnd hold the torch out, while the winds are rough,\nBetween our faces, to cast light on each?—","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=And%20wilt%20thou%20have%20me%20fashion%20into%20speech"},{"id":"browning-XIV","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XIV","text":"But love me for love’s sake, that evermore\nThou may’st love on, through love’s eternity.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=But%20love%20me%20for%20love%E2%80%99s%20sake%2C%20that%20evermore"},{"id":"browning-XVI","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XVI","text":"And as a vanquished soldier yields his sword\nTo one who lifts him from the bloody earth,\nEven so, Belovëd, I at last record,\nHere ends my strife.  If thou invite me forth,\nI rise above abasement at the word.\nMake thy love larger to enlarge my worth!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=And%20as%20a%20vanquished%20soldier%20yields%20his%20sword"},{"id":"browning-XVII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XVII","text":"How, Dearest, wilt thou have me for most use?\nA hope, to sing by gladly? or a fine\nSad memory, with thy songs to interfuse?\nA shade, in which to sing—of palm or pine?\nA grave, on which to rest from singing?  Choose.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=How%2C%20Dearest%2C%20wilt%20thou%20have%20me%20for%20most%20use%3F"},{"id":"browning-XVIII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XVIII","text":"I never gave a lock of hair away\nTo a man, Dearest, except this to thee,\nWhich now upon my fingers thoughtfully\nI ring out to the full brown length and say\n“Take it.”  My day of youth went yesterday;","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=I%20never%20gave%20a%20lock%20of%20hair%20away"},{"id":"browning-XIX","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XIX","text":"The soul’s Rialto hath its merchandize;\nI barter curl for curl upon that mart,\nAnd from my poet’s forehead to my heart\nReceive this lock which outweighs argosies,—","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=The%20soul%E2%80%99s%20Rialto%20hath%20its%20merchandize%3B"},{"id":"browning-XLII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XLII","text":"I seek no copy now of life’s first half:\nLeave here the pages with long musing curled,\nAnd write me new my future’s epigraph,\nNew angel mine, unhoped for in the world!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=I%20seek%20no%20copy%20now%20of%20life%E2%80%99s%20first%20half%3A"},{"id":"browning-XXI","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXI","text":"Say over again, and yet once over again,\nThat thou dost love me.  Though the word repeated\nShould seem a “cuckoo-song,” as thou dost treat it,\nRemember, never to the hill or plain,\nValley and wood, without her cuckoo-strain\nComes the fresh Spring in all her green completed.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Say%20over%20again%2C%20and%20yet%20once%20over%20again%2C"},{"id":"browning-XXXIX","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXXIX","text":"Nothing repels thee, . . . Dearest, teach me so\nTo pour out gratitude, as thou dost, good!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Nothing%20repels%20thee%2C%20.%20.%20.%20Dearest%2C%20teach%20me%20so"},{"id":"browning-IV","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese IV","text":"And dost thou lift this house’s latch too poor\nFor hand of thine? and canst thou think and bear\nTo let thy music drop here unaware\nIn folds of golden fulness at my door?","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=And%20dost%20thou%20lift%20this%20house%E2%80%99s%20latch%20too%20poor"},{"id":"browning-XXV","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXV","text":"My heavy heart.  Then thou didst bid me bring\nAnd let it drop adown thy calmly great\nDeep being!  Fast it sinketh, as a thing\nWhich its own nature does precipitate,\nWhile thine doth close above it, mediating\nBetwixt the stars and the unaccomplished fate.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=My%20heavy%20heart.%20%20Then%20thou%20didst%20bid%20me%20bring"},{"id":"browning-XXVI","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXVI","text":"Belovëd, what they seemed.  Their shining fronts,\nTheir songs, their splendours, (better, yet the same,\nAs river-water hallowed into fonts)\nMet in thee, and from out thee overcame\nMy soul with satisfaction of all wants:\nBecause God’s gifts put man’s best dreams to shame.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Belov%C3%ABd%2C%20what%20they%20seemed.%20%20Their%20shining%20fronts%2C"},{"id":"browning-XXVII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXVII","text":"My own Belovëd, who hast lifted me\nFrom this drear flat of earth where I was thrown,\nAnd, in betwixt the languid ringlets, blown\nA life-breath, till the forehead hopefully\nShines out again, as all the angels see,\nBefore thy saving kiss!  My own, my own,\nWho camest to me when the world was gone,\nAnd I who looked for only God, found thee!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=My%20own%20Belov%C3%ABd%2C%20who%20hast%20lifted%20me"},{"id":"browning-XXVIII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXVIII","text":"Said, Dear I love thee; and I sank and quailed\nAs if God’s future thundered on my past.\nThis said, I am thine—and so its ink has paled\nWith lying at my heart that beat too fast.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Said%2C%20Dear%20I%20love%20thee%3B%20and%20I%20sank%20and%20quailed"},{"id":"browning-XXIX","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXIX","text":"Because, in this deep joy to see and hear thee\nAnd breathe within thy shadow a new air,\nI do not think of thee—I am too near thee.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Because%2C%20in%20this%20deep%20joy%20to%20see%20and%20hear%20thee"},{"id":"browning-XXXI","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXXI","text":"Thou dove-like help! and when my fears would rise,\nWith thy broad heart serenely interpose:\nBrood down with thy divine sufficiencies\nThese thoughts which tremble when bereft of those,\nLike callow birds left desert to the skies.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Thou%20dove-like%20help%21%20and%20when%20my%20fears%20would%20rise%2C"},{"id":"browning-XXXIII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXXIII","text":"Yes, call me by that name,—and I, in truth,\nWith the same heart, will answer and not wait.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Yes%2C%20call%20me%20by%20that%20name%2C%E2%80%94and%20I%2C%20in%20truth%2C"},{"id":"browning-XXXV","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXXV","text":"Yet love me—wilt thou?  Open thy heart wide,\nAnd fold within, the wet wings of thy dove.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Yet%20love%20me%E2%80%94wilt%20thou%3F%20%20Open%20thy%20heart%20wide%2C"},{"id":"browning-XXXVI","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXXVI","text":"When we met first and loved, I did not build\nUpon the event with marble.  Could it mean\nTo last, a love set pendulous between\nSorrow and sorrow?  Nay, I rather thrilled,","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=When%20we%20met%20first%20and%20loved%2C%20I%20did%20not%20build"},{"id":"browning-XXXVIII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XXXVIII","text":"The third upon my lips was folded down\nIn perfect, purple state; since when, indeed,\nI have been proud and said, “My love, my own.”","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=The%20third%20upon%20my%20lips%20was%20folded%20down"},{"id":"browning-XLI","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XLI","text":"Instruct me how to thank thee!  Oh, to shoot\nMy soul’s full meaning into future years,\nThat they should lend it utterance, and salute\nLove that endures, from life that disappears!","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Instruct%20me%20how%20to%20thank%20thee%21%20%20Oh%2C%20to%20shoot"},{"id":"browning-XLIII","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XLIII","text":"How do I love thee?  Let me count the ways.\nI love thee to the depth and breadth and height\nMy soul can reach, when feeling out of sight\nFor the ends of Being and ideal Grace.\nI love thee to the level of everyday’s\nMost quiet need, by sun and candlelight.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=How%20do%20I%20love%20thee%3F%20%20Let%20me%20count%20the%20ways."},{"id":"browning-XLIV","author":"Elizabeth Barrett Browning","title":"Sonnets from the Portuguese XLIV","text":"Here’s ivy!—take them, as I used to do\nThy flowers, and keep them where they shall not pine.\nInstruct thine eyes to keep their colours true,\nAnd tell thy soul, their roots are left in mine.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/2002/pg2002-images.html#:~:text=Here%E2%80%99s%20ivy%21%E2%80%94take%20them%2C%20as%20I%20used%20to%20do"},{"id":"shakespeare-XVII","author":"William Shakespeare","title":"Sonnet 17","text":"If I could write the beauty of your eyes,\nAnd in fresh numbers number all your graces,\nThe age to come would say ‘This poet lies;\nSuch heavenly touches ne’er touch’d earthly faces.’","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=If%20I%20could%20write%20the%20beauty%20of%20your%20eyes%2C"},{"id":"shakespeare-XXI","author":"William Shakespeare","title":"Sonnet 21","text":"O! let me, true in love, but truly write,\nAnd then believe me, my love is as fair\nAs any mother’s child, though not so bright\nAs those gold candles fix’d in heaven’s air:","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=O%21%20let%20me%2C%20true%20in%20love%2C%20but%20truly%20write%2C"},{"id":"shakespeare-XXIV","author":"William Shakespeare","title":"Sonnet 24","text":"Mine eye hath play’d the painter and hath stell’d,\nThy beauty’s form in table of my heart;\nMy body is the frame wherein ’tis held,\nAnd perspective it is best painter’s art.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Mine%20eye%20hath%20play%E2%80%99d%20the%20painter%20and%20hath%20stell%E2%80%99d%2C"},{"id":"shakespeare-XXVII","author":"William Shakespeare","title":"Sonnet 27","text":"Save that my soul’s imaginary sight\nPresents thy shadow to my sightless view,\nWhich, like a jewel hung in ghastly night,\nMakes black night beauteous, and her old face new.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Save%20that%20my%20soul%E2%80%99s%20imaginary%20sight"},{"id":"shakespeare-XLIII","author":"William Shakespeare","title":"Sonnet 43","text":"All days are nights to see till I see thee,\nAnd nights bright days when dreams do show thee me.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=All%20days%20are%20nights%20to%20see%20till%20I%20see%20thee%2C"},{"id":"shakespeare-XLVII","author":"William Shakespeare","title":"Sonnet 47","text":"So, either by thy picture or my love,\nThyself away, art present still with me;\nFor thou not farther than my thoughts canst move,\nAnd I am still with them, and they with thee;\nOr, if they sleep, thy picture in my sight\nAwakes my heart, to heart’s and eye’s delight.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=So%2C%20either%20by%20thy%20picture%20or%20my%20love%2C"},{"id":"shakespeare-LII","author":"William Shakespeare","title":"Sonnet 52","text":"Blessed are you whose worthiness gives scope,\nBeing had, to triumph; being lacked, to hope.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Blessed%20are%20you%20whose%20worthiness%20gives%20scope%2C"},{"id":"shakespeare-LIII","author":"William Shakespeare","title":"Sonnet 53","text":"Speak of the spring, and foison of the year,\nThe one doth shadow of your beauty show,\nThe other as your bounty doth appear;\nAnd you in every blessed shape we know.\nIn all external grace you have some part,\nBut you like none, none you, for constant heart.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Speak%20of%20the%20spring%2C%20and%20foison%20of%20the%20year%2C"},{"id":"shakespeare-LIV","author":"William Shakespeare","title":"Sonnet 54","text":"O! how much more doth beauty beauteous seem\nBy that sweet ornament which truth doth give.\nThe rose looks fair, but fairer we it deem\nFor that sweet odour, which doth in it live.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=O%21%20how%20much%20more%20doth%20beauty%20beauteous%20seem"},{"id":"shakespeare-LVI","author":"William Shakespeare","title":"Sonnet 56","text":"Sweet love, renew thy force; be it not said\nThy edge should blunter be than appetite,\nWhich but to-day by feeding is allay’d,\nTo-morrow sharpened in his former might:","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Sweet%20love%2C%20renew%20thy%20force%3B%20be%20it%20not%20said"},{"id":"shakespeare-LXXV","author":"William Shakespeare","title":"Sonnet 75","text":"So are you to my thoughts as food to life,\nOr as sweet-season’d showers are to the ground;\nAnd for the peace of you I hold such strife\nAs ’twixt a miser and his wealth is found.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=So%20are%20you%20to%20my%20thoughts%20as%20food%20to%20life%2C"},{"id":"shakespeare-XCI","author":"William Shakespeare","title":"Sonnet 91","text":"Thy love is better than high birth to me,\nRicher than wealth, prouder than garments’ costs,\nOf more delight than hawks and horses be;\nAnd having thee, of all men’s pride I boast:","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Thy%20love%20is%20better%20than%20high%20birth%20to%20me%2C"},{"id":"shakespeare-XCVIII","author":"William Shakespeare","title":"Sonnet 98","text":"Nor did I wonder at the lily’s white,\nNor praise the deep vermilion in the rose;\nThey were but sweet, but figures of delight,\nDrawn after you, you pattern of all those.\nYet seem’d it winter still, and you away,\nAs with your shadow I with these did play.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Nor%20did%20I%20wonder%20at%20the%20lily%E2%80%99s%20white%2C"},{"id":"shakespeare-XCIX","author":"William Shakespeare","title":"Sonnet 99","text":"The forward violet thus did I chide:\nSweet thief, whence didst thou steal thy sweet that smells,\nIf not from my love’s breath? The purple pride\nWhich on thy soft cheek for complexion dwells\nIn my love’s veins thou hast too grossly dy’d.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=The%20forward%20violet%20thus%20did%20I%20chide%3A"},{"id":"shakespeare-CV","author":"William Shakespeare","title":"Sonnet 105","text":"Kind is my love to-day, to-morrow kind,\nStill constant in a wondrous excellence;\nTherefore my verse to constancy confin’d,\nOne thing expressing, leaves out difference.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Kind%20is%20my%20love%20to-day%2C%20to-morrow%20kind%2C"},{"id":"shakespeare-CXV","author":"William Shakespeare","title":"Sonnet 115","text":"Those lines that I before have writ do lie,\nEven those that said I could not love you dearer:\nYet then my judgement knew no reason why\nMy most full flame should afterwards burn clearer.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Those%20lines%20that%20I%20before%20have%20writ%20do%20lie%2C"},{"id":"shakespeare-CXXVIII","author":"William Shakespeare","title":"Sonnet 128","text":"Since saucy jacks so happy are in this,\nGive them thy fingers, me thy lips to kiss.","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=Since%20saucy%20jacks%20so%20happy%20are%20in%20this%2C"},{"id":"shakespeare-CXXXII","author":"William Shakespeare","title":"Sonnet 132","text":"And truly not the morning sun of heaven\nBetter becomes the grey cheeks of the east,\nNor that full star that ushers in the even,\nDoth half that glory to the sober west,\nAs those two mourning eyes become thy face:","excerpt":true,"sourceUrl":"https://www.gutenberg.org/cache/epub/1041/pg1041-images.html#:~:text=And%20truly%20not%20the%20morning%20sun%20of%20heaven"}]</script><script src="assets/surprise-message.js"></script></body></html>
