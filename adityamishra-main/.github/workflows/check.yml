name: Check portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pages
        run: python scripts/build.py
      - name: Validate links and content
        run: python scripts/check.py
      - name: Check Python syntax
        run: |
          python -c "import ast; from pathlib import Path; [ast.parse(p.read_text(encoding='utf-8'), filename=str(p)) for p in [Path('publisher.py'), *Path('scripts').glob('*.py')]]"
      - name: Ensure generated files are current
        run: git diff --exit-code
